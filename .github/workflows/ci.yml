name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.8.14
      - run: uv sync --locked --extra dev --extra agent
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - run: uv run --locked --extra dev --extra agent pytest
      - run: python scripts/check_docs.py
      - run: uv run --locked incident-lab evaluate
      - run: python -m incident_lab replay examples/ollama-qwen3-8b/comparison.json
      - run: uv run --locked --extra agent incident-lab agent-demo

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.14
      - run: uv build
      - run: python scripts/check_distributions.py
      - name: Install wheel and run outside the checkout
        shell: bash
        run: |
          uv venv /tmp/incident-lab-wheel
          uv pip install --python /tmp/incident-lab-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/incident-lab-wheel/bin/python -m incident_lab demo --scenario INC-001
          /tmp/incident-lab-wheel/bin/python -m incident_lab evaluate
          /tmp/incident-lab-wheel/bin/python -m incident_lab replay "$GITHUB_WORKSPACE/examples/ollama-qwen3-8b/comparison.json"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t incident-lab .
      - run: docker run --rm incident-lab demo --scenario INC-001
      - run: docker run --rm incident-lab evaluate
